<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Start UI</title>
    <link rel="stylesheet" href="styles/start.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-label="Game start interface">
        <div class="top-row">
          <span class="badge">Game Start</span>
          <span class="chip">● Online</span>
        </div>
        <h1>Ready to play?</h1>
        <p>Your account is ready. Choose a mode and jump into the game.</p>

        <div class="game-grid">
          <article class="panel">
            <h2>Quick Match</h2>
            <p>Start a fast round and test your reaction time.</p>
            <div class="btn-row"><button>Play now</button><button class="ghost">How to play</button></div>
          </article>

          <article class="panel">
            <h2>Challenge Mode</h2>
            <p>Unlock harder levels and aim for a higher score.</p>
            <div class="btn-row"><button>Begin challenge</button><button class="ghost">View scores</button></div>
          </article>

          <article class="panel">
            <h2>Player Status</h2>
            <p>Level 1 • 0 wins • 3 lives ready</p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
