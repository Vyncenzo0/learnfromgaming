<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account</title>
    <link rel="stylesheet" href="styles/signup.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-label="Create account interface">
        <div class="eyebrow">New account</div>
        <h1>Create your account</h1>
        <p>Start with a few details and get access to your game in minutes.</p>
        <p style="font-size: 0.92rem; color: #bfdbfe;">Tip: Use the same student ID you’ll use for password recovery later.</p>

        <form id="signup-form" novalidate>
          <div class="field">
            <label for="name">Full name</label>
            <input id="name" type="text" required />
          </div>

          <div class="field">
            <label for="student-id">Student ID</label>
            <input id="student-id" type="text" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" required />
          </div>

          <div class="field">
            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" type="password" required />
          </div>

          <div class="field">
            <label for="hint-question">Personal hint question</label>
            <select id="hint-question" required>
              <option value="" selected disabled hidden>Choose a personal hint question</option>
              <option value="What is your favorite color?">What is your favorite color?</option>
              <option value="What is your first pet’s name?">What is your first pet’s name?</option>
              <option value="What city were you born in?">What city were you born in?</option>
            </select>
          </div>

          <div class="field">
            <label for="hint-answer">Personal hint answer</label>
            <input id="hint-answer" type="text" required />
          </div>

          <button type="submit">Create account</button>
          <p id="signup-message" class="footer-note" style="margin-top: 0; display: none;"></p>
        </form>

        <p class="footer-note">Already have an account? <a href="login.html">Sign in</a></p>
      </section>
    </main>

    <script>
      const signupForm = document.getElementById('signup-form');
      const signupMessage = document.getElementById('signup-message');

      signupForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const studentId = document.getElementById('student-id').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const hintQuestion = document.getElementById('hint-question').value;
        const hintAnswer = document.getElementById('hint-answer').value.trim();

        if (password !== confirmPassword) {
          signupMessage.textContent = 'Passwords do not match.';
          signupMessage.style.display = 'block';
          signupMessage.style.color = '#fca5a5';
          return;
        }

        if (!studentId || !hintQuestion || !hintAnswer) {
          signupMessage.textContent = 'Please complete every field.';
          signupMessage.style.display = 'block';
          signupMessage.style.color = '#fca5a5';
          return;
        }

        const accounts = JSON.parse(localStorage.getItem('accountsDB') || '[]');
        const existingAccount = accounts.find((account) => account.studentId === studentId);

        if (existingAccount) {
          signupMessage.textContent = 'This student ID is already registered.';
          signupMessage.style.display = 'block';
          signupMessage.style.color = '#fca5a5';
          return;
        }

        accounts.push({
          studentId,
          password,
          hintQuestion,
          hintAnswer: hintAnswer.toLowerCase()
        });

        localStorage.setItem('accountsDB', JSON.stringify(accounts));

        signupMessage.textContent = 'Account created. You can now use your personal hint to reset your password.';
        signupMessage.style.display = 'block';
        signupMessage.style.color = '#bbf7d0';
        signupForm.reset();
      });
    </script>
  </body>
</html>
