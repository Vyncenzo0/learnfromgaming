<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <link rel="stylesheet" href="styles/forgot-password.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-label="Forgot password interface">
        <div class="eyebrow">Account help</div>
        <h1>Forgot your password?</h1>
        <p>Answer your personal hint and create a new password.</p>

        <form id="reset-form" novalidate>
          <div class="field">
            <label for="student-id">Student ID</label>
            <input id="student-id" type="text" required />
          </div>

          <div class="field">
            <label for="hint-question">Personal hint question</label>
            <select id="hint-question" required>
              <option value="" selected disabled hidden>Choose your personal hint question</option>
              <option value="What is your favorite color?">What is your favorite color?</option>
              <option value="What is your first pet’s name?">What is your first pet’s name?</option>
              <option value="What city were you born in?">What city were you born in?</option>
            </select>
          </div>

          <div class="field">
            <label for="hint-answer">Personal hint answer</label>
            <input id="hint-answer" type="text" required />
          </div>

          <div class="field">
            <label for="new-password">New password</label>
            <input id="new-password" type="password" required />
          </div>

          <div class="field">
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" type="password" required />
          </div>

          <button type="submit">Reset password</button>
          <p id="reset-message" class="footer-note" style="margin-top: 0; display: none;"></p>
        </form>

        <p class="footer-note"><a href="login.html">Back to sign in</a></p>
      </section>
    </main>
    <script src="forgot-password.js"></script>
  </body>
</html>
