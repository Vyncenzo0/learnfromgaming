<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <link rel="stylesheet" href="styles/forgot-password.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-label="Forgot password interface">
        <div class="eyebrow">Account help</div>
        <h1>Forgot your password?</h1>
        <p>Answer your personal hint and create a new password.</p>

        <form id="reset-form" novalidate>
          <div class="field">
            <label for="student-id">Student ID</label>
            <input id="student-id" type="text" required />
          </div>

          <div class="field">
            <label for="hint-question">Personal hint question</label>
            <select id="hint-question" required>
              <option value="" selected disabled hidden>Choose your personal hint question</option>
              <option value="What is your favorite color?">What is your favorite color?</option>
              <option value="What is your first pet’s name?">What is your first pet’s name?</option>
              <option value="What city were you born in?">What city were you born in?</option>
            </select>
          </div>

          <div class="field">
            <label for="hint-answer">Personal hint answer</label>
            <input id="hint-answer" type="text" required />
          </div>

          <div class="field">
            <label for="new-password">New password</label>
            <input id="new-password" type="password" required />
          </div>

          <div class="field">
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" type="password" required />
          </div>

          <button type="submit">Reset password</button>
          <p id="reset-message" class="footer-note" style="margin-top: 0; display: none;"></p>
        </form>

        <p class="footer-note"><a href="login.html">Back to sign in</a></p>
      </section>
    </main>

    <script>
      const resetForm = document.getElementById('reset-form');
      const resetMessage = document.getElementById('reset-message');

      resetForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const studentId = document.getElementById('student-id').value.trim();
        const hintQuestion = document.getElementById('hint-question').value;
        const hintAnswer = document.getElementById('hint-answer').value.trim().toLowerCase();
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        const accounts = JSON.parse(localStorage.getItem('accountsDB') || '[]');
        const savedAccount = accounts.find((account) => account.studentId === studentId);

        if (!savedAccount) {
          resetMessage.textContent = 'No saved account was found. Please create an account first.';
          resetMessage.style.display = 'block';
          resetMessage.style.color = '#fca5a5';
          return;
        }

        if (hintQuestion !== savedAccount.hintQuestion || hintAnswer !== savedAccount.hintAnswer) {
          resetMessage.textContent = 'The personal hint answer does not match.';
          resetMessage.style.display = 'block';
          resetMessage.style.color = '#fca5a5';
          return;
        }

        if (newPassword !== confirmPassword) {
          resetMessage.textContent = 'New passwords do not match.';
          resetMessage.style.display = 'block';
          resetMessage.style.color = '#fca5a5';
          return;
        }

        savedAccount.password = newPassword;
        localStorage.setItem('accountsDB', JSON.stringify(accounts));

        resetMessage.textContent = 'Password reset complete. You can now sign in with your new password.';
        resetMessage.style.display = 'block';
        resetMessage.style.color = '#bbf7d0';
        resetForm.reset();
      });
    </script>
  </body>
</html>
